name: Deploy main to Netlify

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy production
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Link Netlify project
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
        run: >-
          npx --yes netlify-cli@26.2.0 link
          --id="$NETLIFY_SITE_ID"
          --auth="$NETLIFY_AUTH_TOKEN"

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: >-
          npx --yes netlify-cli@26.2.0 deploy
          --prod
          --no-build
          --dir=dist
          --functions=netlify/functions
          --auth="$NETLIFY_AUTH_TOKEN"
          --message="GitHub Actions deploy $GITHUB_SHA"
