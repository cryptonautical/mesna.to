name: Deploy main to Netlify

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Trigger Netlify production build
    runs-on: ubuntu-latest
    steps:
      - name: Request Netlify build
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: curl --fail --silent --show-error --request POST "$NETLIFY_BUILD_HOOK"
